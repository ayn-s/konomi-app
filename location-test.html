<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>位置情報テスト</title>
<style>
  body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;max-width:640px;margin:32px auto;padding:0 16px;line-height:1.8;color:#222}
  h1{font-size:20px}
  table{border-collapse:collapse;width:100%;margin:12px 0}
  td{border:1px solid #ccc;padding:8px 10px;vertical-align:top}
  td:first-child{width:11em;background:#f4f4f4;font-weight:700}
  button{font:inherit;padding:12px 22px;border-radius:8px;border:0;background:#1a73e8;color:#fff;cursor:pointer}
  #result{margin-top:16px;padding:12px 14px;border-radius:8px;background:#f4f4f4;white-space:pre-wrap}
  .ok{background:#e6f4ea!important}.ng{background:#fce8e6!important}
  small{color:#666}
</style>
</head>
<body>
<h1>位置情報テスト(コノミ用)</h1>
<p>自販機とは関係なく、このブラウザで位置情報が使えるかだけを調べます。</p>

<table>
  <tr><td>このページのアドレス</td><td id="origin"></td></tr>
  <tr><td>安全な接続か</td><td id="secure"></td></tr>
  <tr><td>ブラウザの許可の状態</td><td id="perm">調べています…</td></tr>
</table>

<button id="go" type="button">位置情報を取得してみる</button>
<div id="result" role="status">ボタンを押してください。アドレスバー付近に許可の確認が出たら「許可」を選びます。</div>
<p><small>座標は画面に出すだけで、どこにも送信しません。</small></p>

<script>
const $ = id => document.getElementById(id);
$("origin").textContent = location.origin;
$("secure").textContent = window.isSecureContext
  ? "はい(使えます)"
  : "いいえ → https:// か localhost / 127.0.0.1 で開き直してください";

const PERM_TEXT = {
  granted: "許可されています",
  prompt: "まだ決まっていません(ボタンを押すと許可の確認が出ます)",
  denied: "ブロックされています → 下の「直し方」を試してください"
};
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "geolocation" }).then(s => {
    const show = () => { $("perm").textContent = PERM_TEXT[s.state] || s.state; };
    show(); s.onchange = show;
  }).catch(() => { $("perm").textContent = "このブラウザでは調べられません"; });
} else {
  $("perm").textContent = "このブラウザでは調べられません";
}

const ERR = {
  1: "【許可されていません(PERMISSION_DENIED)】\nこのサイトの位置情報がブロックされています。\n直し方: アドレスバー左のアイコン(鍵や調整のマーク)→「位置情報」を「許可」→ページを再読み込み。\n見当たらないときは、Chromeなら chrome://settings/content/location を開き、「ブロックする」の一覧にこのアドレスがあれば削除してください。",
  2: "【位置を特定できません(POSITION_UNAVAILABLE)】\nブラウザの許可は通っていますが、パソコン本体が位置を返せていません。\n直し方: Windows=設定→プライバシーとセキュリティ→位置情報をオン(ブラウザも許可)。Mac=システム設定→プライバシーとセキュリティ→位置情報サービスをオンにして、ブラウザにも許可。",
  3: "【時間切れ(TIMEOUT)】\n15秒待っても位置が返りませんでした。許可の確認が出ていないか、アドレスバー付近を見てください。"
};

$("go").onclick = () => {
  const r = $("result");
  r.className = "";
  if (!navigator.geolocation) { r.textContent = "このブラウザは位置情報に対応していません。"; r.className = "ng"; return; }
  r.textContent = "取得しています…(許可の確認が出たら「許可」を選んでください)";
  navigator.geolocation.getCurrentPosition(
    p => {
      r.className = "ok";
      r.textContent = "取得できました。\n緯度 " + p.coords.latitude.toFixed(2) + " / 経度 " + p.coords.longitude.toFixed(2) +
        "\n誤差 約" + Math.round(p.coords.accuracy) + " m\n→ ブラウザとパソコンの設定は問題ありません。";
    },
    e => { r.className = "ng"; r.textContent = ERR[e.code] || ("エラー: " + e.message); },
    { timeout: 15000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
